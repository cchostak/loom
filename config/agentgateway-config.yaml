# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Agentgateway v1.5 standalone configuration.

# Telemetry & Observability
frontendPolicies:
  tracing:
    host: "otel-collector:4317"
    randomSampling: true

# LLM Gateway & Guardrails
llm:
  port: 8080
  models:
    - name: "*"
      provider: openrouter
      params:
        apiKey: "$OPENROUTER_API_KEY"
      guardrails:
        request:
          - webhook:
              target:
                host: guardrail-proxy:9090
              headers:
                ":path": '"/request"'
        response:
          - webhook:
              target:
                host: guardrail-proxy:9090
              headers:
                ":path": '"/response"'

# Model Context Protocol (MCP) Server Registry & Policy
mcp:
  port: 3000
  targets:
    - name: "filesystem"
      stdio:
        cmd: "/usr/local/bin/loom-filesystem"
        args: ["--isolated"]

  policies:
    mcpAuthorization:
      rules:
        # CEL authorization is allow-list based; unmatched tools are denied and
        # filtered from discovery responses.
        - 'mcp.tool.name == "read_text_file" || mcp.tool.name == "list_directory"'
