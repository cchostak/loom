# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Agentgateway v1.5 standalone configuration.

# Telemetry & Observability
frontendPolicies:
  tracing:
    host: "otel-collector:4317"
    randomSampling: true

# LLM Gateway & Guardrails
llm:
  port: 8080
  models:
    - name: "*"
      provider: openrouter
      params:
        apiKey: "$OPENROUTER_API_KEY"
      guardrails:
        request:
          - webhook:
              target:
                host: guardrail-proxy:9090
              headers:
                ":path": '"/request"'
        response:
          - webhook:
              target:
                host: guardrail-proxy:9090
              headers:
                ":path": '"/response"'

# Model Context Protocol (MCP) Server Registry & Policy
mcp:
  port: 3000
  targets:
    - name: "filesystem"
      stdio:
        cmd: "npx"
        args:
          - "-y"
          - "@modelcontextprotocol/server-filesystem"
          - "/workspace"

  policies:
    mcpAuthorization:
      rules:
        # CEL authorization is allow-list based; unmatched tools are denied and
        # filtered from discovery responses.
        - 'mcp.tool.name == "read_text_file" || mcp.tool.name == "read_media_file" || mcp.tool.name == "read_multiple_files" || mcp.tool.name == "list_directory" || mcp.tool.name == "list_directory_with_sizes" || mcp.tool.name == "directory_tree" || mcp.tool.name == "search_files" || mcp.tool.name == "get_file_info" || mcp.tool.name == "list_allowed_directories"'
