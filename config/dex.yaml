# Dex static configuration for Loom local OIDC identity stage.
#
# This file is generated by scripts/bootstrap_dex.py and rewritten on each
# 'make dex-init'. Do NOT hand-edit client secrets here; bootstrap writes them.
#
# Production note: replace staticClients and staticPasswords with a real
# connector (GitHub, LDAP, SAML) and remove this file from version control
# once secrets have been moved to a secrets manager.

issuer: http://dex:5556/dex

storage:
  type: sqlite3
  config:
    file: /data/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  # Enforce PKCE on every authorization-code flow.
  responseTypes: [code]
  skipApprovalScreen: true
  # Short-lived access tokens; id_token lifetime set by expiry below.
  # Loom's OIDC authenticator enforces ≤ 10 min token lifetime anyway.
  tokenLifetime: 10m

# Loom control-plane is the single OAuth 2.0 resource server.
# Clients authenticate service accounts, not human browser sessions.
staticClients: []   # bootstrap_dex.py rewrites this block

staticPasswords: []  # unused — service accounts use client_credentials

logger:
  level: warn
  format: json
