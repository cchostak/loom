name: Strands security integration
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strands-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secured-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned packaging tool
        run: python3 -m pip install uv==0.12.18
      - name: Lock, static checks and unit regressions
        run: make strands-test
      - name: Build and exercise real enforcement without provider credentials
        run: make strands-lab
      - name: Upload content-free scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strands-security-evidence
          path: strands-report.json
          retention-days: 7
      - name: Stop isolated lab
        if: always()
        run: docker compose -p loom-strands-lab -f docker-compose.yml -f integrations/strands/compose.lab.yml --profile agents down -v --remove-orphans
