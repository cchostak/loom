name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Run Go vet and fmt check
        run: |
          cd docker
          test -z "$(gofmt -l .)" || (echo "Unformatted files found:" && gofmt -l . && exit 1)
          go vet ./...

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .
          config_data: "{extends: relaxed, rules: {line-length: {max: 180}}}"

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './tests'
          severity: error

      - name: Hadolint (Dockerfiles)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: 'docker/Dockerfile.guardrail'
          failure-threshold: error

  test-unit:
    name: Go Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Run Unit Tests with Race Detector
        run: |
          cd docker
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Security configuration and pipeline regressions
        run: |
          python3 -m pip install httpx==0.27.2
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage-report
          path: docker/coverage.out
          retention-days: 7

  docker-lint-build:
    name: Container Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          python3 scripts/bootstrap.py
          docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Guardrail Proxy Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.guardrail
          push: false
          tags: loom/guardrail-proxy:ci-test

  test-integration:
    name: End-to-End Integration Smoke Tests
    needs: [test-unit, docker-lint-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup environment file
        run: |
          cp .env.example .env
          python3 scripts/bootstrap.py

      - name: Launch Docker Compose stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Run Smoke Test Suite
        run: |
          chmod +x tests/smoke_test.sh
          ./tests/smoke_test.sh --timeout 60

      - name: Capture container logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v
