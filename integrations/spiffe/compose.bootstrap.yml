services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.3@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
    command: ['-config', '/config/server.conf']
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 512m
    volumes:
      - ./integrations/spiffe/server.conf:/config/server.conf:ro
      - spire-server-data:/data
    tmpfs: ['/run/spire-server:rw,noexec,nosuid,size=8m', '/tmp:rw,noexec,nosuid,size=16m']
    networks: [workload-identity]
  docker-metadata:
    build: {context: ./docker, dockerfile: Dockerfile.workload}
    entrypoint: ['/app/docker-metadata']
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 64m
    environment: {LOOM_COMPOSE_PROJECT: loom-enterprise}
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-metadata-socket:/relay
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
    command: ['-config', '/config/agent.conf']
    user: '0:0'
    pid: host
    cgroup: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 512m
    volumes:
      - ./.loom/spiffe/agent.conf:/config/agent.conf:ro
      - ./.loom/spiffe/bundle.pem:/config/bundle.pem:ro
      - spire-agent-data:/data
      - spire-workload-socket:/run/spire
      - docker-metadata-socket:/relay:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    depends_on: [spire-server, docker-metadata]
    networks: [workload-identity]
networks:
  workload-identity:
    internal: true
    ipam:
      config: [{subnet: 10.232.231.0/28}]
volumes:
  spire-server-data: {}
  spire-agent-data: {}
  spire-workload-socket: {}
  docker-metadata-socket: {}
