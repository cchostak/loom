server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire-server/api.sock"
  trust_domain = "loom.local"
  data_dir = "/data"
  default_x509_svid_ttl = "5m"
  ca_ttl = "24h"
  log_level = "WARN"
}
plugins {
  DataStore "sql" { plugin_data { database_type = "sqlite3" connection_string = "/data/datastore.sqlite3" } }
  NodeAttestor "join_token" { plugin_data {} }
  KeyManager "disk" { plugin_data { keys_path = "/data/keys.json" } }
}
