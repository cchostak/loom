services:
  agentgateway:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.gateway
    container_name: agentgateway
    restart: unless-stopped
    ports:
      - "${LOOM_LLM_PORT:-8080}:8080" # LLM Gateway
      - "${LOOM_MCP_PORT:-3000}:3000" # MCP Gateway
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AGENTGATEWAY_CONFIG_FILE=/etc/agentgateway/config.yaml
    volumes:
      - ./config/agentgateway-config.yaml:/etc/agentgateway/config.yaml:ro
      - ./workspace:/workspace
    depends_on:
      otel-collector:
        condition: service_healthy
      guardrail-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - ide-net

  vscode:
    image: codercom/code-server:4.135.0
    container_name: vscode
    restart: unless-stopped
    ports:
      - "${LOOM_IDE_PORT:-8443}:8080" # IDE Web UI
    environment:
      - PASSWORD=${IDE_PASSWORD:-ide_super_secret_password_change_me}
      - SUDO_PASSWORD=${IDE_PASSWORD:-ide_super_secret_password_change_me}
      - DEFAULT_WORKSPACE=/home/coder/project
      - AGENTGATEWAY_LLM_URL=http://agentgateway:8080/v1
      - AGENTGATEWAY_MCP_URL=http://agentgateway:3000
    volumes:
      - ./workspace:/home/coder/project
    networks:
      - ide-net

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "${LOOM_JAEGER_PORT:-16686}:16686" # Jaeger Web UI
      - "4317"       # Internal OTLP gRPC endpoint
    networks:
      - ide-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${LOOM_OTEL_GRPC_PORT:-4317}:4317" # OTLP gRPC receiver
      - "${LOOM_OTEL_HTTP_PORT:-4318}:4318" # OTLP HTTP receiver
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - ide-net

  guardrail-proxy:
    build:
      context: ./docker
      dockerfile: Dockerfile.guardrail
    container_name: guardrail-proxy
    restart: unless-stopped
    ports:
      - "${LOOM_GUARDRAIL_PORT:-9090}:9090"
    environment:
      - PII_PRESIDIO_URL=${PII_PRESIDIO_URL:-http://presidio-analyzer:5002}
      - PII_THRESHOLD=${PII_THRESHOLD:-0.7}
    depends_on:
      presidio-analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s
    networks:
      - ide-net

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    restart: unless-stopped
    environment:
      - ANALYZER_CONF_FILE=/usr/bin/conf/default_analyzer.yaml
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - ide-net

  swarm-lab:
    profiles: ["lab"]
    build:
      context: ./docker
      dockerfile: Dockerfile.lab
    environment:
      - GUARDRAIL_URL=http://guardrail-proxy:9090
    depends_on:
      guardrail-proxy:
        condition: service_healthy
    networks:
      - ide-net

  # ── Ingestion Pipeline (profile: pipeline) ────────────────────────────────
  # Medallion architecture: Bronze → Silver (PII scrub) → Gold (embed + vec)
  # RAG endpoint: retrieve from gold → augment → agentgateway → OpenRouter LLM
  #
  # Start with: make pipeline
  # Or manually: docker compose --profile pipeline up -d pipeline
  pipeline:
    profiles: ["pipeline"]
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: pipeline
    restart: unless-stopped
    ports:
      - "${LOOM_PIPELINE_PORT:-8181}:8181"
    environment:
      - AGENTGATEWAY_URL=http://agentgateway:8080/v1
      - GUARDRAIL_URL=http://guardrail-proxy:9090
      - PRESIDIO_URL=http://presidio-analyzer:5002
      - PII_THRESHOLD=${PII_THRESHOLD:-0.7}
      - DEFAULT_RAG_MODEL=${DEFAULT_RAG_MODEL:-openai/gpt-4o-mini}
      - DB_PATH=/data/loom.db
      - MODEL_CACHE_DIR=/models
    volumes:
      - pipeline-data:/data
      - pipeline-models:/models
    depends_on:
      guardrail-proxy:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      agentgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - ide-net

networks:
  ide-net:
    driver: bridge
    name: ide-net

volumes:
  # SQLite database file for the three medallion layers
  pipeline-data:
    name: loom-pipeline-data
  # sentence-transformers model cache (all-MiniLM-L6-v2, ~90 MB)
  pipeline-models:
    name: loom-pipeline-models
