x-restricted: &restricted
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  ulimits:
    nofile: {soft: 1024, hard: 2048}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  control-plane:
    <<: *restricted
    build: {context: ./docker, dockerfile: Dockerfile.control}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOOM_LLM_PORT:-8080}:8080"
      - "127.0.0.1:${LOOM_MCP_PORT:-3000}:8080"
    volumes:
      - ./config:/config:ro
      - ./.loom/identity:/identity:ro
      - security-audit:/audit
    depends_on:
      agentgateway: {condition: service_healthy}
      guardrail-proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [client-net, mediation, agents]

  agentgateway:
    <<: *restricted
    build: {context: ., dockerfile: ./docker/Dockerfile.gateway}
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./config/agentgateway-config.yaml:/etc/agentgateway/config.yaml:ro
      - ./workspace:/workspace:ro
    depends_on:
      guardrail-proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/loom-filesystem", "--health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [mediation, provider-egress]

  vscode:
    <<: *restricted
    image: codercom/code-server:4.135.0
    user: "1000:1000"
    restart: unless-stopped
    read_only: false # IDE extensions/config need a writable home; no sudo grant.
    mem_limit: 2g
    ports: ["127.0.0.1:${LOOM_IDE_PORT:-8443}:8080"]
    environment:
      - PASSWORD=${IDE_PASSWORD:?Set IDE_PASSWORD in .env}
      - DEFAULT_WORKSPACE=/home/coder/project
      - AGENTGATEWAY_LLM_URL=http://control-plane:8080/v1
      - AGENTGATEWAY_MCP_URL=http://control-plane:8080/mcp
    volumes: ["./workspace:/home/coder/project"]
    networks: [client-net]

  jaeger:
    <<: *restricted
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    user: "65532:65532"
    restart: unless-stopped
    ports: ["127.0.0.1:${LOOM_JAEGER_PORT:-16686}:16686"]
    networks: [telemetry, observability-ui]

  otel-collector:
    <<: *restricted
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    user: "65532:65532"
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml", "--feature-gates=ottl.set.allowNil"]
    volumes: ["./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks: [mediation, telemetry]

  guardrail-proxy:
    <<: *restricted
    build: {context: ./docker, dockerfile: Dockerfile.guardrail}
    restart: unless-stopped
    environment:
      - PII_PRESIDIO_URL=http://presidio-analyzer:5002
      - PII_THRESHOLD=${PII_THRESHOLD:-0.7}
    depends_on:
      presidio-analyzer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/health"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [mediation, inspection]

  presidio-analyzer:
    <<: *restricted
    image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    user: "1001:1001"
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    environment:
      - PORT=5002
      - GUNICORN_CMD_ARGS=--control-socket /tmp/gunicorn.ctl
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks: [inspection]

  swarm-lab:
    <<: *restricted
    profiles: ["lab"]
    build: {context: ./docker, dockerfile: Dockerfile.lab}
    environment: ["GUARDRAIL_URL=http://guardrail-proxy:9090"]
    depends_on:
      guardrail-proxy: {condition: service_healthy}
    networks: [mediation]

  # Optional local-only prototype. Shared production ingestion is not supported.
  pipeline:
    <<: *restricted
    profiles: ["pipeline"]
    build: {context: ./pipeline, dockerfile: Dockerfile}
    restart: unless-stopped
    user: "65532:65532"
    mem_limit: 3g
    ports: ["127.0.0.1:${LOOM_PIPELINE_PORT:-8181}:8181"]
    environment:
      - AGENTGATEWAY_URL=http://control-plane:8080/v1
      - LOOM_TOKEN_FILE=/run/loom/client.token
      - GUARDRAIL_URL=http://guardrail-proxy:9090
      - PRESIDIO_URL=http://presidio-analyzer:5002
      - DB_PATH=/data/loom.db
      - MODEL_CACHE_DIR=/models
      - HF_HUB_OFFLINE=1
    volumes:
      - ./.loom/pipeline.token:/run/loom/client.token:ro
      - pipeline-data:/data
      - pipeline-models:/models
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [client-net, inspection]

  strands-researcher:
    <<: *restricted
    profiles: ["agents"]
    build: {context: ./integrations/strands, target: runtime}
    user: "65532:65532"
    environment: ["LOOM_AGENT_ROLE=researcher"]
    secrets:
      - source: strands-researcher
        target: loom_token
    stdin_open: true
    dns: ["127.0.0.1"]
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [agents]

  strands-planner:
    <<: *restricted
    profiles: ["agents"]
    build: {context: ./integrations/strands, target: runtime}
    user: "65532:65532"
    environment: ["LOOM_AGENT_ROLE=planner"]
    secrets:
      - source: strands-planner
        target: loom_token
    stdin_open: true
    dns: ["127.0.0.1"]
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [agents]

  strands-operator:
    <<: *restricted
    profiles: ["agents"]
    build: {context: ./integrations/strands, target: runtime}
    user: "65532:65532"
    environment: ["LOOM_AGENT_ROLE=operator"]
    secrets:
      - source: strands-operator
        target: loom_token
    stdin_open: true
    dns: ["127.0.0.1"]
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [agents]

  strands-publisher:
    <<: *restricted
    profiles: ["agents"]
    build: {context: ./integrations/strands, target: runtime}
    user: "65532:65532"
    environment: ["LOOM_AGENT_ROLE=publisher"]
    secrets:
      - source: strands-publisher
        target: loom_token
    stdin_open: true
    dns: ["127.0.0.1"]
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [agents]

networks:
  agents: {internal: true}
  client-net: {}
  mediation: {internal: true}
  inspection: {internal: true}
  telemetry: {internal: true}
  observability-ui: {}
  provider-egress: {}
volumes:
  pipeline-data: {}
  pipeline-models: {}
  security-audit: {}

secrets:
  strands-researcher:
    file: ./.loom/strands/researcher.token
  strands-planner:
    file: ./.loom/strands/planner.token
  strands-operator:
    file: ./.loom/strands/operator.token
  strands-publisher:
    file: ./.loom/strands/publisher.token
